name: build insurance pdf apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          build-essential libltdl-dev \
          libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev

    - name: install buildozer and cython
      run: pip3 install --upgrade buildozer cython==0.29.37

    - name: clear buildozer cache
      run: rm -rf ~/.buildozer

    - name: build apk
      run: |
        export PYTHONPATH=/usr/lib/python3.10:$PYTHONPATH
        buildozer android debug
      timeout-minutes: 60

    - name: upload apk
      uses: actions/upload-artifact@v4
      with:
        name: insurancepdfviewer-apk
        path: bin/*.apk
        retention-days: 30

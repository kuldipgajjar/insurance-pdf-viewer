name: build insurance pdf apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          build-essential libltdl-dev \
          libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev

    - name: cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: install buildozer and cython
      run: pip3 install --upgrade buildozer cython==0.29.37

    - name: build apk with retries
      run: |
        export PYTHONPATH=/usr/lib/python3.10:$PYTHONPATH
        export P4A_RELEASE_BRANCH=develop
        for i in {1..3}; do
          echo "Build attempt $i of 3..."
          buildozer android debug && break || {
            if [ $i -lt 3 ]; then
              echo "Attempt $i failed, retrying in 3 minutes..."
              sleep 180
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          }
        done
      timeout-minutes: 300
      env:
        BUILDOZER_LOG_LEVEL: 2

    - name: upload apk
      uses: actions/upload-artifact@v4
      with:
        name: insurancepdfviewer-apk
        path: bin/*.apk
        retention-days: 30
      if: success()
